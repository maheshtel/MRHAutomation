appId: com.mrh.mobilestore
---
# Taps a bottom tab and waits for the destination screen.
#
# Usage:
#   - runFlow:
#       file: ../nav/go-to-tab.yaml      # path is relative to the calling file
#       env:
#         TAB: Account                   # Home | Shop | Cart | Account
#         SCREEN_ID: account-guest-content
#
# TAB is matched against the tab's accessibility label from DSTabBar.tsx
# ("Home tab", "Cart tab, 2 items", ...). The tabs have no testID in the app,
# so this label is the most stable locator; it works on Android and iOS, and
# the trailing ".*" covers the Cart tab's item count.
# SCREEN_ID is the id (or id regex) of an element that proves the screen loaded.
#
# Why this is one retry block and not "tap, then check with when: notVisible":
# a `when: notVisible` check on an element that IS visible makes Maestro wait
# for it to disappear (about 7s) before moving on, and the old version paid
# that on every single call (measured on both Android and iOS: ~6.6s per call).
# Here the success path has no such check: tap, wait for the screen, done.
# If the tap or the wait fails, the whole pair is retried (2 extra attempts).
#
# A keyboard left open can hide the tab bar. Close it where it is opened or
# last used (for example at the end of the login subflow) instead of here, so
# normal tab changes don't pay for it.
#
# retryTapIfNoChange: false - when we're already on this tab, the tap changes
# nothing, and Maestro's default would keep waiting and re-tapping (measured:
# 50s). A tap that really didn't land is handled by the retry block.

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "${TAB} tab.*"
          retryTapIfNoChange: false
          label: "Tap the ${TAB} tab"
      - extendedWaitUntil:
          visible:
            id: ${SCREEN_ID}
          timeout: 30000
          label: "Wait for ${SCREEN_ID}"
