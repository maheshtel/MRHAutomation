appId: com.mrh.mobilestore
---
# Closes the on-screen keyboard after typing into a single-line field.
# Same on Android and iOS: the keyboard's Done/Return key is pressed.
#
# Why not `hideKeyboard`:
#   - iOS: `hideKeyboard` fails ("Couldn't hide the keyboard") after waiting
#     about 35s when the keyboard has no standard dismiss action, and it
#     failed this way on the CI simulator.
#   - Android: `hideKeyboard` presses Back, which can also close the sheet or
#     screen the field is on.
# Enter blurs a single-line field on both platforms (and may submit the form,
# which the calling flow already allows for).
#
# Do NOT use this for multi-line fields: Enter would add a new line there.

- pressKey: Enter
