appId: com.mrh.mobilestore
---
# Signs out from the Account tab.
#
# Precondition: signed in.
# Ends on:      the Account tab in guest state (account-guest-signin visible).
#
# Written to survive both the Android emulator and the iOS simulator on slow
# CI machines, where scrolls and taps take several seconds each:
#   - The whole attempt (open Account, scroll, tap, check) sits in a retry
#     block, so a tap that landed on the floating tab bar, or a scroll that
#     ran out of time, is simply tried again from a known place.
#   - Step 1 only needs Sign Out to be on screen (no centering), so it can't
#     get stuck when the row is too close to the end of the list to be centered.
#   - Step 2 then tries to center it clear of the floating tab bar. It is
#     optional and short (8s): on the iOS simulator the row can't be centered
#     (the list is already at its end), so this step always runs to its limit
#     there and then the tap goes ahead; the tap worked in the CI run.
#   - The result is checked by waiting for the guest screen, not by a fixed
#     sleep, so a fast device doesn't wait and a slow one gets enough time.

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          file: ../nav/go-to-tab.yaml
          env:
            TAB: Account
            SCREEN_ID: account-logged-in-content

      # 1. Make sure Sign Out is on screen. Ends as soon as it appears.
      - scrollUntilVisible:
          element:
            id: account-menu-sign-out
          direction: DOWN
          speed: 60
          visibilityPercentage: 50
          timeout: 60000
          label: Scroll until Sign Out is on screen

      # 2. Move it clear of the floating tab bar (no-op if already clear).
      - scrollUntilVisible:
          element:
            id: account-menu-sign-out
          direction: DOWN
          centerElement: true
          visibilityPercentage: 80
          timeout: 8000
          optional: true
          label: Center Sign Out above the tab bar

      - tapOn:
          id: account-menu-sign-out
          label: Tap Sign Out

      - extendedWaitUntil:
          visible:
            id: account-guest-signin
          timeout: 45000
          label: Wait for the guest Account screen
