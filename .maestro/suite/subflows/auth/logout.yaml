appId: com.mrh.mobilestore
---
# Signs out from the Account tab.
#
# Precondition: signed in.
# Ends on:      the Account tab in guest state (account-guest-signin visible).

- runFlow:
    file: ../nav/go-to-tab.yaml
    env:
      TAB: Account
      SCREEN_ID: account-logged-in-content

# Sign Out sits at the bottom of the Account screen, where the floating tab
# bar covers it. Swipe inside the list (50%, 70% -> 25%) so the gesture never
# starts on the tab bar, and stop as soon as the button is visible.
- repeat:
    while:
      notVisible:
        id: account-menu-sign-out
    times: 6
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 25%
          duration: 600

# One more swipe lifts the button clear of the tab bar so the tap lands on it.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 600

- tapOn:
    id: account-menu-sign-out

- extendedWaitUntil:
    visible:
      id: account-guest-signin
    timeout: 20000
    label: Wait for guest Account screen