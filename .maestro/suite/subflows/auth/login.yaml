appId: com.mrh.mobilestore
---
# Signs in as TEST_EMAIL / TEST_PASSWORD (loaded from .env.test by run.ps1).
#
# Precondition: app is running as a guest (subflows/app/launch.yaml).
# Ends on:      the Account tab, signed in (account-logged-in-content visible).

- runFlow:
    file: ../nav/go-to-tab.yaml
    env:
      TAB: Account
      SCREEN_ID: account-guest-content

- tapOn:
    id: account-guest-signin
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 45000
    label: Wait for the login screen

- tapOn:
    id: email-input
# Android: the email is read back and retyped if characters were lost (slow
# emulators drop key events). iOS: a plain inputText, as before.
- runFlow:
    file: ../common/type-text.yaml
    env:
      FIELD_ID: email-input
      TEXT: ${TEST_EMAIL}

# Move to the password field with the keyboard's Next key, not by tapping it.
# The email field has returnKeyType="next" and its onSubmitEditing focuses the
# password field (src/screens/LoginScreen.tsx), so this works whether or not
# the field is on screen. Tapping it by id failed on the Azure Android emulator
# (720x1280, run 20261110-143332): with the keyboard open (plus its "Suggest
# contact names?" strip) the password field was hidden and not in the UI tree
# at all -> "Element not found: password-input" in every test that signs in.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
# Where the field IS on screen (large phones, iOS), tap it as well. That's the
# old behaviour and makes sure it has focus before typing.
- runFlow:
    when:
      visible:
        id: password-input
    label: Password field on screen - tap it
    commands:
      - tapOn:
          id: password-input
- inputText: ${TEST_PASSWORD}

# Submit with the keyboard's Done key: the password field's onSubmitEditing
# runs the same handler as the Sign In button. This replaces hideKeyboard +
# tapOn sign-in-button, because hideKeyboard is very slow on Android (35s
# measured) and the keyboard can cover the button on small screens.
- pressKey: Enter

# Wait for the signed-in Account screen, and type the password again if the
# form rejected it.
#
# Why: on the hosted iOS simulator (iOS run 20261111-093900) inputText sent the
# password while the keyboard was still being set up for the secure field: the
# keyboard took the first key event, the rest went nowhere, the field stayed
# empty and the app answered "Password is required". The test then waited out
# the full 90s and failed. Slow Android emulators can drop key events the same way.
#
# How: up to 3 tries of 30s each (90s in total, as before, for a slow sandbox
# API). Try 1 is just the wait. Tries 2 and 3 first check whether the form shows
# a password error (on iOS the error is part of the field's accessibility label,
# on Android it's its own text, so the regex is open on both sides). If it does,
# they type the password again and submit. If not (sign-in is still loading),
# they keep waiting.
# A signed-in screen ends the wait at once, so a good run takes no extra time:
# the checks only run after a try has failed.
- evalScript: ${output.signInTry = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.signInTry = output.signInTry + 1}
      - runFlow:
          when:
            true: ${output.signInTry > 1}
          label: Not signed in yet - check the form for a password error
          commands:
            - runFlow:
                when:
                  visible:
                    text: '.*(Password is required|Email or password is incorrect).*'
                label: The password did not arrive - type it again and submit
                commands:
                  - tapOn:
                      id: password-input
                  - eraseText: 30
                  - inputText: ${TEST_PASSWORD}
                  - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: account-logged-in-content
          timeout: 30000
          label: Wait for signed-in Account screen
