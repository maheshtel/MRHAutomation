# ─────────────────────────────────────────────────────────────────────────────
# Appium E2E — Android emulator on a Microsoft-hosted agent
#
# Flow (the emulator boots in the background while everything else runs):
#   checkout → start emulator ┐
#   node + deps (cached)      │ overlap
#   download APK              ┘
#   wait for boot → install APK once → run tests → publish reports
#
# One-time setup: variable group `mrh-e2e` (Pipelines › Library) with
#   TEST_USER_EMAIL     (secret)
#   TEST_USER_PASSWORD  (secret)
#   APP_SAS_TOKEN       (secret, optional — only if the blob container is private)
# ─────────────────────────────────────────────────────────────────────────────

name: android-e2e-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none # run manually (Pipelines › Run pipeline) or on the schedule below
pr: none

# schedules:
#   - cron: '0 2 * * 1-5' # 02:00 UTC, Monday–Friday
#     displayName: Nightly Android E2E
#     branches:
#       include: [TaskAppiumAutomation]
#     always: true

parameters:
  - name: suite
    displayName: Test suite
    type: string
    default: all
    values: [all, smoke, login, navigation, cart, quantity-promotions, wishlist, cleanup, logout]
  - name: retries
    displayName: Retries per failing test
    type: number
    default: 1
  - name: apkUrl
    displayName: APK URL
    type: string
    default: https://autoteststoragemahesh.blob.core.windows.net/maheshcontainer/mrh.apk
  - name: apiLevel
    displayName: Emulator Android API level
    type: string
    default: '34'
  # google_atd = Google's CI ("Automated Test Device") image: same Google Play
  # services, far less background work. Lighter OS image = what made iOS fast
  # (iOS 26 → 18). Opt-in until a CI run proves it (scripts/ci/android-emulator.sh).
  - name: systemImage
    displayName: Emulator system image (google_atd = lighter CI image, still has Google Play services)
    type: string
    default: google_apis
    values: [google_apis, google_atd]
  # The emulator needs hardware acceleration (KVM on Linux, Hypervisor.framework
  # on macOS). Not every hosted image exposes it; the "Start emulator" step
  # checks within seconds and says so. If no hosted image works, use a scale-set
  # pool on a nested-virtualization VM size (agentPool).
  - name: vmImage
    displayName: Hosted agent image (needs hardware acceleration for the emulator)
    type: string
    default: macOS-latest
    values: [macOS-latest, macOS-15, macOS-14, ubuntu-latest]
  - name: agentPool
    displayName: Self-hosted / scale-set pool name (empty = hosted image above)
    type: string
    default: ' '
  - name: installOnce
    displayName: Install the APK once (faster) instead of on every spec file
    type: boolean
    default: true

variables:
  - group: mrh-e2e
  - name: CI
    value: 'true'
  - name: NODE_VERSION
    value: '22.x'
  - name: NPM_CONFIG_CACHE # npm reads this; cached by the 'Cache npm downloads' step
    value: $(Pipeline.Workspace)/.npm

jobs:
  - job: android_e2e
    displayName: Appium · Android emulator (API ${{ parameters.apiLevel }})
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 2
    pool:
      ${{ if eq(trim(parameters.agentPool), '') }}:
        vmImage: ${{ parameters.vmImage }}
      ${{ else }}:
        name: ${{ trim(parameters.agentPool) }}

    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
        clean: true

      # ── 1. Start the emulator first: it boots while the next steps run ─────
      - bash: |
          set -euo pipefail
          rm -f .env # CI reads pipeline variables only, never a stray local .env
          chmod +x scripts/ci/*.sh
          mkdir -p logs reports
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          case "$(uname -m)" in arm64|aarch64) abi=arm64-v8a ;; *) abi=x86_64 ;; esac
          echo "##vso[task.setvariable variable=SYSTEM_IMAGE_DIR]$sdk/system-images/android-${{ parameters.apiLevel }}/${{ parameters.systemImage }}/$abi"
          echo "##vso[task.setvariable variable=EMULATOR_ABI]$abi"
        displayName: Prepare agent

      - task: Cache@2
        displayName: Cache emulator system image
        inputs:
          key: 'android-sysimg | "$(Agent.OS)" | "${{ parameters.apiLevel }}" | "${{ parameters.systemImage }}" | "$(EMULATOR_ABI)" | v1'
          path: $(SYSTEM_IMAGE_DIR)

      - bash: ./scripts/ci/android-emulator.sh start ${{ parameters.apiLevel }}
        displayName: Start emulator (background boot, ${{ parameters.systemImage }})
        timeoutInMinutes: 15
        env:
          EMULATOR_IMAGE_TAG: ${{ parameters.systemImage }}

      # ── 2. Toolchain + dependencies (cached node_modules = no npm install) ──
      - task: NodeTool@0
        displayName: Use Node.js $(NODE_VERSION)
        inputs:
          versionSpec: $(NODE_VERSION)

      # Cache npm's compressed downloads, not node_modules: restoring the
      # ~50k-file node_modules took as long as installing it (~22 min) on a
      # hosted Mac. With the download cache, npm ci installs offline.
      - task: Cache@2
        displayName: Cache npm downloads
        inputs:
          key: 'npm | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)" | "$(Agent.OSArchitecture)"
          path: $(NPM_CONFIG_CACHE)

      # npm ci without install scripts, then only the ones the suite needs; the
      # XCUITest add-on is taken prebuilt or compiled tolerantly (see script).
      - bash: ./scripts/ci/install-deps.sh
        displayName: Install test suite (WebdriverIO, Appium, UiAutomator2)
        env:
          SKIP_IOS_ADDON: 'true' # the XCUITest add-on is never used on Android

      # ── 3. App under test ─────────────────────────────────────────────────
      - bash: ./scripts/ci/download-app.sh android "${{ parameters.apkUrl }}"
        displayName: Download APK
        env:
          APP_SAS_TOKEN: $(APP_SAS_TOKEN)

      # ── 4. Device ready ───────────────────────────────────────────────────
      # The script gives up on its own after EMULATOR_BOOT_TIMEOUT (600 s) with
      # its progress lines in this log; the step timeout sits above that (the
      # boot deadline + one bounded check + the post-boot settings), so the
      # script, not Azure, ends a stuck boot.
      - bash: ./scripts/ci/android-emulator.sh wait
        displayName: Wait for emulator boot + disable animations
        timeoutInMinutes: 15

      - ${{ if eq(parameters.installOnce, true) }}:
          # Installed once here; each session then starts with `pm clear` (fresh
          # app data) instead of reinstalling the 130 MB APK. On success the
          # script sets ANDROID_APP_PREINSTALLED, which the test step reads; if
          # this step fails, the flag stays unset and Appium installs instead.
          - bash: ./scripts/ci/android-emulator.sh install "$(ANDROID_APP_PATH)"
            displayName: Install APK on emulator
            timeoutInMinutes: 10
            continueOnError: true

      # ── 5. Tests ──────────────────────────────────────────────────────────
      - bash: |
          set -euo pipefail
          for v in TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [[ -z "${!v:-}" || "${!v}" == '$('* ]]; then
              echo "##vso[task.logissue type=error]$v is not set. Add it to the 'mrh-e2e' variable group."
              exit 1
            fi
          done
          # Installed by the "Install APK" step: drive it by package name, so
          # Appium does not reinstall it. Cleared here in the script, not with
          # an empty `ANDROID_APP_PATH: ''` under env: that did not override
          # the pipeline variable set by download-app.sh (2026-11-23: the
          # session still got appium:app, and each reinstall hit the 240 s
          # install timeout).
          if [[ "${ANDROID_APP_PREINSTALLED:-}" == true ]]; then # unset arrives as '$(NAME)'
            echo "[app] already installed by the 'Install APK' step: Appium drives it by package name"
            export ANDROID_APP_PATH=''
          else
            echo "[app] not preinstalled: Appium installs $ANDROID_APP_PATH in the session"
          fi
          # Same evidence as the iOS pipeline's host-resources.log, plus the
          # guest: every 30 s, the agent's load / swap / top processes and the
          # emulator's own load and top processes. On 2026-11-23 the first 4 min
          # of lookups took 8–56 s each while the device was still busy after
          # boot; this shows that (and what it was busy with) directly.
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          adb_within() { local s="$1"; shift; perl -e 'alarm shift @ARGV; exec @ARGV or die' "$s" "$sdk/platform-tools/adb" "$@"; }
          (
            set +e +o pipefail # a failed sample must not end the sampler
            while true; do
              {
                echo "=== $(date -u +%H:%M:%S)  host load: $(uptime | sed 's/.*load averages*: //')  $(sysctl -n vm.swapusage 2>/dev/null || free -m | awk '/Swap/ {print "swap used " $3 " MB"}')"
                if [[ "$(uname -s)" == Darwin ]]; then
                  top -l 2 -s 1 -n 6 -o cpu -stats pid,command,cpu,mem | tail -7
                else
                  top -b -n 1 -o %CPU | sed -n 7,13p
                fi
                echo "--- guest load: $(adb_within 10 shell cat /proc/loadavg 2>/dev/null | tr -d '\r')"
                adb_within 15 shell top -b -n 1 -q -s 2 -o PID,%CPU,RES,ARGS 2>/dev/null | tr -d '\r' | sed -n 1,6p | cut -c1-140
              } >> logs/host-resources.log 2>&1
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          suite_arg=""
          if [[ "${{ parameters.suite }}" != all ]]; then suite_arg="--suite ${{ parameters.suite }}"; fi
          npx wdio run config/wdio.android.conf.ts $suite_arg
        displayName: Run Appium tests (${{ parameters.suite }})
        timeoutInMinutes: 60
        # Failing tests mark the job "partially succeeded" (orange) instead of
        # failed: Azure saves the pipeline caches (emulator system image, npm)
        # only for jobs that succeed, and without them the next run downloads
        # everything again. Failures still show on the step and in the Tests tab.
        continueOnError: true
        env:
          TEST_USER_EMAIL: $(TEST_USER_EMAIL)
          TEST_USER_PASSWORD: $(TEST_USER_PASSWORD)
          ANDROID_DEVICE_TYPE: emulator
          ANDROID_UDID: $(ANDROID_UDID)
          ANDROID_APP_PATH: $(ANDROID_APP_PATH)
          ANDROID_APP_PREINSTALLED: $(ANDROID_APP_PREINSTALLED)
          TEST_RETRIES: ${{ parameters.retries }}
          # A spec whose session could not start is re-run once at the end of the
          # run (new session, warmed-up device) instead of failing outright.
          SPEC_FILE_RETRIES: '1'
          WAIT_TIMEOUT: '45000' # shared hosted agents are slower than a dev machine
          LOG_LEVEL: warn
          # Each finished spec's logs + failure evidence are uploaded as they
          # happen, so they survive even if the agent is lost mid-run.
          LIVE_ARTIFACT_NAME: android-live-diagnostics-attempt$(System.JobAttempt)

      # ── 6. Reports (always, so failures are diagnosable) ──────────────────
      - task: PublishTestResults@2
        displayName: Publish test results (Tests tab)
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: reports/junit/*.xml
          mergeTestResults: true
          failTaskOnFailedTests: false
          testRunTitle: Android · ${{ parameters.suite }} · API ${{ parameters.apiLevel }} ${{ parameters.systemImage }}

      - bash: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME_17_arm64:-${JAVA_HOME:-}}}"
          npx allure generate reports/allure-results --clean --single-file -o reports/allure-report
        displayName: Build Allure report (single HTML file)
        condition: succeededOrFailed()
        continueOnError: true

      # Device log, "isn't responding" / crash records and the device's top
      # processes into logs/device (Appium's own logcat stream is off:
      # skipLogcatCapture). Only when something failed, like the iOS
      # pipeline's simulator log: failing tests leave the job
      # "SucceededWithIssues" (continueOnError), which still collects it.
      - bash: ./scripts/ci/android-emulator.sh collect
        displayName: Collect device log + ANR / crash records (only when something failed)
        condition: and(always(), ne(variables['Agent.JobStatus'], 'Succeeded'))
        timeoutInMinutes: 6
        continueOnError: true

      - task: PublishPipelineArtifact@1
        displayName: Publish reports (Allure, JUnit, screenshots, page sources)
        condition: always()
        inputs:
          targetPath: reports
          artifact: android-reports-attempt$(System.JobAttempt)

      - task: PublishPipelineArtifact@1
        displayName: Publish logs (Appium, WebdriverIO, emulator)
        condition: always()
        inputs:
          targetPath: logs
          artifact: android-logs-attempt$(System.JobAttempt)

      - bash: ./scripts/ci/android-emulator.sh stop
        displayName: Stop emulator
        condition: always()
