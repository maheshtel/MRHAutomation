# ─────────────────────────────────────────────────────────────────────────────
# Appium E2E — iOS simulator on a Microsoft-hosted macOS agent
#
# Flow (heavy CPU/disk steps one at a time — the hosted Intel Mac is small):
#   checkout → node → deps (npm + add-on cached) → compile WebDriverAgent (cached)
#   start simulator ┐ overlap: the download is network-bound
#   download .app   ┘
#   wait for boot → warm up → run tests → publish reports
#
# Speed: WebDriverAgent is compiled once in its own step and cached, so
# sessions only launch it; headless simulator, reduced motion, cached
# node_modules.
#
# One-time setup: variable group `mrh-e2e` (Pipelines › Library) with
#   TEST_USER_EMAIL     (secret)
#   TEST_USER_PASSWORD  (secret)
#   APP_SAS_TOKEN       (secret, optional — only if the blob container is private)
# ─────────────────────────────────────────────────────────────────────────────

name: ios-e2e-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none # run manually (Pipelines › Run pipeline) or on the schedule below
pr: none

# schedules:
#   - cron: '0 3 * * 1-5' # 03:00 UTC, Monday–Friday
#     displayName: Nightly iOS E2E
#     branches:
#       include: [TaskAppiumAutomation]
#     always: true

parameters:
  - name: suite
    displayName: Test suite
    type: string
    default: all
    values: [all, smoke, login, navigation, cart, quantity-promotions, wishlist, cleanup, logout]
  - name: retries
    displayName: Retries per failing test
    type: number
    default: 1
  - name: appZipUrl
    displayName: Simulator .app.zip URL
    type: string
    default: https://autoteststoragemahesh.blob.core.windows.net/maheshcontainer/MountainRose.app.zip
  - name: deviceName
    displayName: Simulator device
    type: string
    default: iPhone 16
  - name: iosVersion
    displayName: iOS version — 18 = newest 18.x (much lighter than iOS 26 on hosted Intel Macs); empty = newest
    type: string
    default: '18'
  - name: xcodeVersion
    displayName: Xcode version, e.g. 16.4 (empty = agent default)
    type: string
    default: ' '
  - name: wdaLaunch
    displayName: WebDriverAgent launch (preinstalled = fast; xcodebuild = fallback)
    type: string
    default: preinstalled
    values: [preinstalled, xcodebuild]
  - name: vmImage
    displayName: Hosted macOS image
    type: string
    default: macOS-latest
    values: [macOS-latest, macOS-15, macOS-14]

variables:
  - group: mrh-e2e
  - name: CI
    value: 'true'
  - name: NODE_VERSION
    value: '22.x'
  - name: NPM_CONFIG_CACHE # npm reads this; cached by the 'Cache npm downloads' step
    value: $(Pipeline.Workspace)/.npm
  - name: CORESIM_CACHE_DIR
    value: $(Pipeline.Workspace)/coresim-build
  - name: WDA_BUILD_DIR
    value: $(Pipeline.Workspace)/wda-build

jobs:
  - job: ios_e2e
    displayName: Appium · iOS simulator (${{ parameters.deviceName }})
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 2
    pool:
      vmImage: ${{ parameters.vmImage }}

    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
        clean: true

      # One step for all agent prep (each extra step costs task startup time):
      # workspace, optional Xcode selection, and the Xcode version the cache
      # keys below need.
      - bash: |
          set -euo pipefail
          rm -f .env # CI reads pipeline variables only, never a stray local .env
          chmod +x scripts/ci/*.sh
          mkdir -p logs reports
          xcode="${{ trim(parameters.xcodeVersion) }}"
          if [[ -n "$xcode" ]]; then
            sudo xcode-select -s "/Applications/Xcode_${xcode}.app/Contents/Developer"
          fi
          v="$(xcodebuild -version | sed -n 1p | tr -cd '0-9.')"
          echo "Xcode $v"
          echo "##vso[task.setvariable variable=XCODE_VERSION]$v"
        displayName: Prepare agent (+ Xcode version)

      - task: NodeTool@0
        displayName: Use Node.js $(NODE_VERSION)
        inputs:
          versionSpec: $(NODE_VERSION)

      # Heavy CPU/disk steps run ONE AT A TIME. Booting the simulator in the
      # background during npm ci + native compiles starved the small hosted
      # Intel Mac (npm ci 18 min, add-on compile 20+ min). The simulator now
      # boots after them, overlapping only the network-bound app download.

      # ── 1. Dependencies ───────────────────────────────────────────────────
      # npm's compressed downloads (npm ci then installs offline) and the
      # compiled XCUITest add-on (@appium/coresim: no Intel prebuild, so it is
      # compiled once and reused) are cached.
      - task: Cache@2
        displayName: Cache npm downloads
        inputs:
          key: 'npm | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)" | "$(Agent.OSArchitecture)"
          path: $(NPM_CONFIG_CACHE)

      - task: Cache@2
        displayName: Cache compiled simulator add-on
        inputs:
          key: 'coresim | "$(Agent.OSArchitecture)" | "$(XCODE_VERSION)" | package-lock.json'
          path: $(CORESIM_CACHE_DIR)

      - bash: ./scripts/ci/install-deps.sh
        displayName: Install test suite (WebdriverIO, Appium, XCUITest)
        timeoutInMinutes: 35
        env:
          CORESIM_CACHE_DIR: $(CORESIM_CACHE_DIR)

      # ── 2. Simulator: boots while WebDriverAgent restores + the app downloads
      # (WDA normally comes from the cache, so nothing heavy competes; only a
      # cache miss compiles alongside the boot, once).
      - bash: ./scripts/ci/ios-simulator.sh start "${{ parameters.deviceName }}" "${{ trim(parameters.iosVersion) }}"
        displayName: Start simulator (background boot)
        timeoutInMinutes: 10

      # ── 3. WebDriverAgent: compiled once, cached, only LAUNCHED by Appium ─
      - task: Cache@2
        displayName: Cache compiled WebDriverAgent
        inputs:
          # package-lock pins the xcuitest driver (and so the WDA sources);
          # a different Xcode needs a fresh build.
          key: 'wda-build | "$(Agent.OSArchitecture)" | "$(XCODE_VERSION)" | package-lock.json'
          path: $(WDA_BUILD_DIR)

      - bash: ./scripts/ci/build-wda.sh "$(WDA_BUILD_DIR)"
        displayName: Compile WebDriverAgent (build-for-testing)
        timeoutInMinutes: 20

      # ── 4. App under test ─────────────────────────────────────────────────
      - bash: ./scripts/ci/download-app.sh ios "${{ parameters.appZipUrl }}"
        displayName: Download + unzip .app
        env:
          APP_SAS_TOKEN: $(APP_SAS_TOKEN)

      # ── 5. Device ready ───────────────────────────────────────────────────
      - bash: ./scripts/ci/ios-simulator.sh wait
        displayName: Wait for simulator boot + reduce motion
        timeoutInMinutes: 10

      # A freshly booted simulator keeps doing first-boot work for minutes, and
      # an app's very first launch is its slowest. Pay both here, once, instead
      # of inside the first Appium session (where it caused session timeouts).
      - bash: |
          set -uo pipefail
          start=$(date +%s)
          xcrun simctl install "$IOS_UDID" "$IOS_APP_PATH"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$IOS_APP_PATH/Info.plist")"
          xcrun simctl launch "$IOS_UDID" "$bundle_id" >/dev/null && sleep 20
          xcrun simctl terminate "$IOS_UDID" "$bundle_id" || true
          echo "[warm-up] app installed and launched once in $(( $(date +%s) - start ))s"
        displayName: Warm up simulator (install + first launch)
        timeoutInMinutes: 8
        continueOnError: true

      # ── 6. Tests ──────────────────────────────────────────────────────────
      - bash: |
          set -euo pipefail
          for v in TEST_USER_EMAIL TEST_USER_PASSWORD; do
            if [[ -z "${!v:-}" || "${!v}" == '$('* ]]; then
              echo "##vso[task.logissue type=error]$v is not set. Add it to the 'mrh-e2e' variable group."
              exit 1
            fi
          done
          if [[ -z "${IOS_WDA_DERIVED_DATA_PATH:-}" || "$IOS_WDA_DERIVED_DATA_PATH" == '$('* ]]; then
            echo "##vso[task.logissue type=error]IOS_WDA_DERIVED_DATA_PATH is not set — the 'Compile WebDriverAgent' step must succeed first."
            exit 1
          fi
          # WebDriverAgent launch: "preinstalled" installs the compiled runner app
          # and starts it directly (seconds); "xcodebuild" runs
          # test-without-building per session (~3.5 min on a hosted Intel Mac).
          if [[ "${{ parameters.wdaLaunch }}" == preinstalled && -n "${IOS_WDA_RUNNER_APP:-}" && "$IOS_WDA_RUNNER_APP" != '$('* ]]; then
            echo "[wda] preinstalled launch: $IOS_WDA_RUNNER_APP"
            export IOS_PREBUILT_WDA_PATH="$IOS_WDA_RUNNER_APP"
            unset IOS_WDA_DERIVED_DATA_PATH
          else
            echo "[wda] xcodebuild launch (test-without-building)"
          fi
          suite_arg=""
          if [[ "${{ parameters.suite }}" != all ]]; then suite_arg="--suite ${{ parameters.suite }}"; fi
          npx wdio run config/wdio.ios.conf.ts $suite_arg
        displayName: Run Appium tests (${{ parameters.suite }})
        timeoutInMinutes: 70
        # Failing tests mark the job "partially succeeded" (orange) instead of
        # failed: Azure saves the pipeline caches (npm, add-on, WebDriverAgent)
        # only for jobs that succeed, and without them every run rebuilds
        # everything. Failures still show on the step and in the Tests tab.
        continueOnError: true
        env:
          TEST_USER_EMAIL: $(TEST_USER_EMAIL)
          TEST_USER_PASSWORD: $(TEST_USER_PASSWORD)
          IOS_DEVICE_TYPE: simulator
          IOS_UDID: $(IOS_UDID)
          IOS_DEVICE_NAME: $(IOS_DEVICE_NAME)
          IOS_PLATFORM_VERSION: $(IOS_PLATFORM_VERSION)
          IOS_APP_PATH: $(IOS_APP_PATH)
          IOS_HEADLESS: 'true'
          IOS_WDA_DERIVED_DATA_PATH: $(IOS_WDA_DERIVED_DATA_PATH)
          IOS_WDA_RUNNER_APP: $(IOS_WDA_RUNNER_APP)
          # xcodebuild output in the Appium log: 82% of all log lines and real CPU on a
          # starved agent. Turn on only to debug WebDriverAgent startup.
          IOS_SHOW_XCODE_LOG: 'false'
          TEST_RETRIES: ${{ parameters.retries }}
          # A spec whose session could not start is re-run once at the end of the
          # run (new session, warmed-up device) instead of failing outright.
          SPEC_FILE_RETRIES: '1'
          WAIT_TIMEOUT: '45000' # shared hosted agents are slower than a dev machine
          LOG_LEVEL: warn
          # Each finished spec's logs + failure evidence are uploaded as they
          # happen, so they survive even if the agent is lost mid-run.
          LIVE_ARTIFACT_NAME: ios-live-diagnostics-attempt$(System.JobAttempt)

      # ── 7. Reports (always, so failures are diagnosable) ──────────────────
      - task: PublishTestResults@2
        displayName: Publish test results (Tests tab)
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: reports/junit/*.xml
          mergeTestResults: true
          failTaskOnFailedTests: false
          testRunTitle: iOS · ${{ parameters.suite }} · ${{ parameters.deviceName }}

      - bash: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME_17_arm64:-${JAVA_HOME:-}}}"
          npx allure generate reports/allure-results --clean --single-file -o reports/allure-report
        displayName: Build Allure report (single HTML file)
        condition: succeededOrFailed()
        continueOnError: true

      - bash: |
          # Simulator system log of the last 30 min — app crashes show up here.
          [[ -n "${IOS_UDID:-}" && "$IOS_UDID" != '$('* ]] || exit 0
          xcrun simctl spawn "$IOS_UDID" log show --last 30m --style compact \
            --predicate 'process CONTAINS "MountainRose" OR process CONTAINS "WebDriverAgent"' \
            > logs/simulator.log 2>/dev/null || true
        displayName: Collect simulator log (only when something failed)
        # `log show` over 30 min is slow on a hosted Mac and only useful for a
        # crash, so a fully green run skips it. Failing tests leave the job
        # "SucceededWithIssues" (continueOnError), which still collects it.
        condition: and(always(), ne(variables['Agent.JobStatus'], 'Succeeded'))
        continueOnError: true

      - task: PublishPipelineArtifact@1
        displayName: Publish reports (Allure, JUnit, screenshots, page sources)
        condition: always()
        inputs:
          targetPath: reports
          artifact: ios-reports-attempt$(System.JobAttempt)

      - task: PublishPipelineArtifact@1
        displayName: Publish logs (Appium, WebdriverIO, simulator)
        condition: always()
        inputs:
          targetPath: logs
          artifact: ios-logs-attempt$(System.JobAttempt)

      - bash: ./scripts/ci/ios-simulator.sh stop
        displayName: Shut down simulator
        condition: always()
