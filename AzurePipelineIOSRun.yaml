# Maestro iOS tests - Azure DevOps, Microsoft-hosted macOS agent, manual trigger only.
trigger: none
pr: none

parameters:
  - name: appZipUrl
    displayName: 'iOS simulator app (.app zip) download URL'
    type: string
    default: 'https://autoteststoragemahesh.blob.core.windows.net/maheshcontainer/MountainRose.app.zip'
  - name: testPath
    displayName: 'Test file, folder or glob (relative to .maestro/suite; empty or "tests" = tests/**/*.yaml)'
    type: string
    default: 'tests/**/*.yaml'
  - name: retries
    displayName: 'Retries per failed test'
    type: number
    default: 0
  - name: iosDevice
    displayName: 'Simulator device name'
    type: string
    default: 'iPhone 17 Pro'
  - name: iosVersion
    displayName: 'Simulator iOS version'
    type: string
    default: '26.1'
  - name: blockQuic
    displayName: 'Block QUIC (UDP 443) so the simulator falls back to normal HTTPS (fixes "No internet connection")'
    type: boolean
    default: true
  - name: blockApplePush
    displayName: 'Block Apple Push (APNs) traffic - stops the simulator apsd reconnect loop that saturates the CPU'
    type: boolean
    default: true
  - name: captureHomeUi
    displayName: 'Diagnostics: capture a screenshot + UI tree of the Home screen before the tests (adds several minutes)'
    type: boolean
    default: false
  - name: xcodeVersion
    displayName: 'Xcode version to select (needs to match the iOS runtime)'
    type: string
    default: '26.1'

variables:
  MAESTRO_VERSION: '2.11.0'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'   # 10 min (was 3 min): the hosted Mac is slow
  # "Agent environment resources ... Unable to get CPU info, exception: The operation was
  # canceled" is the agent's DEBUG resource monitor: every few seconds it runs a CPU probe,
  # which times out when the machine is saturated. It is a symptom (CPU starvation), not an
  # error, and it only prints with system diagnostics on. Keep debug off for normal runs (set
  # to 'true' only when you need agent diagnostics) and switch the monitor off, so it neither
  # spams the log nor spawns extra probe processes on an already busy Mac.
  system.debug: 'false'
  AZP_ENABLE_RESOURCE_MONITOR_DEBUG_OUTPUT: 'false'
  AZP_ENABLE_RESOURCE_UTILIZATION_WARNINGS: 'false'
  APP_WORK_DIR: '$(Agent.TempDirectory)/ios-app'
  FAILURE_DIR: '$(Build.ArtifactStagingDirectory)/failure-artifacts'

jobs:
- job: maestro_ios
  displayName: Maestro - iOS
  timeoutInMinutes: 60          # 60 is the maximum for Microsoft-hosted agents on a free/private project
  cancelTimeoutInMinutes: 10    # after a timeout, the 'always' steps (reports, artifacts) still get 10 minutes
  pool:
    vmImage: macOS-15
  steps:
  - script: |
      echo "##vso[task.setvariable variable=JOB_START_EPOCH]$(date +%s)"
    displayName: Start job clock

  - checkout: self
    fetchDepth: 1              # shallow clone = faster checkout
    clean: false

  # ---- Select the Xcode that matches the requested iOS runtime
  - script: |
      set -uo pipefail
      CAND="$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -n 1 || true)"
      if [ -n "$CAND" ]; then
        sudo xcode-select -s "$CAND/Contents/Developer"
        echo "Selected: $CAND"
      else
        echo "##vso[task.logissue type=warning]Xcode ${XCODE_VERSION} not found on this image. Installed versions:"
        ls -d /Applications/Xcode*.app || true
      fi
      sw_vers
      echo "CPU architecture: $(uname -m)"
      xcodebuild -version
      xcrun simctl list runtimes
    displayName: Select Xcode and show agent info
    env:
      XCODE_VERSION: ${{ parameters.xcodeVersion }}

  # ---- Free up CPU and fix networking BEFORE the simulator boots.
  #
  # 1) Spotlight: a fresh hosted Mac indexes the checkout, the unzipped .app and the
  #    simulator data (mds_stores), competing with the simulator for the 3 vCPUs.
  #
  # 2) Apple Push (APNs): on this hosted Mac the simulator's push daemon (apsd) cannot get
  #    its certificate from the host ("SimulatorServicesErrorDomain Code=100 Connection
  #    invalid"). Its TLS connection to Apple (port 5223) succeeds, the cert refresh fails, it
  #    disconnects (reason 14) and reconnects immediately - ~5 times a second, all run long.
  #    Because the connect itself succeeds, apsd never counts a failure and never backs off.
  #    In one 10-minute test it wrote 708,000 of the 1.26 million simulator log lines (the
  #    226 MB device-simulator.log). That loop, plus Maestro streaming its log, is what
  #    starves the CPU (slow taps, slow hierarchy, and the agent's CPU probe timing out).
  #    Rejecting APNs traffic makes the connect itself fail, so apsd backs off and goes quiet.
  #    The tests do not use push. APNs uses TCP 5223, falling back to TCP 443, on Apple's
  #    17.0.0.0/8 network. Set blockApplePush=false to turn this off.
  #
  # 3) QUIC: the app's requests (api.mountainroseherbs.com, and the reachability probe
  #    https://clients3.google.com/generate_204) went over QUIC (HTTP/3, UDP 443) and hung
  #    until cancelled/timed out (-1001), so the app showed "No internet connection" and
  #    sign-in failed. Rejecting UDP 443 makes them fall back to HTTPS over TCP at once.
  #
  # All rules are loaded in one go (pfctl -f replaces the main ruleset).
  - script: |
      set -uo pipefail
      sudo mdutil -a -i off >/dev/null 2>&1 && echo "Spotlight indexing disabled" || echo "mdutil failed - continuing"

      echo "--- Host network check (TCP) ---"
      for u in https://clients3.google.com/generate_204 https://api.mountainroseherbs.com/; do
        curl -sS -m 15 -o /dev/null -w "$u -> HTTP %{http_code} in %{time_total}s\n" "$u" || echo "$u -> FAILED"
      done

      RULES=""
      if [ "$BLOCK_QUIC" = "true" ]; then
        RULES+="block return out quick proto udp from any to any port 443"$'\n'
      fi
      if [ "$BLOCK_APPLE_PUSH" = "true" ]; then
        RULES+="block return out quick proto tcp from any to any port 5223"$'\n'
        RULES+="block return out quick proto tcp from any to 17.0.0.0/8 port 443"$'\n'
      fi
      if [ -n "$RULES" ]; then
        echo "--- Loading packet filter rules ---"
        printf '%s' "$RULES"
        printf '%s' "$RULES" | sudo pfctl -ef - 2>&1 || echo "pfctl failed - continuing without the rules"
        sudo pfctl -sr 2>&1 | head -5 || true
      else
        echo "No packet filter rules requested"
      fi

      echo "--- Top CPU consumers before the simulator boots ---"
      ps -Ao pcpu,pmem,comm -r | head -n 8 || true
    displayName: Free CPU and set network rules (Spotlight, APNs, QUIC)
    continueOnError: true
    timeoutInMinutes: 5
    env:
      BLOCK_QUIC: ${{ parameters.blockQuic }}
      BLOCK_APPLE_PUSH: ${{ parameters.blockApplePush }}

  # ---- Pick the simulator and START booting it now; it boots while the next steps run
  - script: |
      set -euo pipefail
      RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
      DEVICETYPE_ID="com.apple.CoreSimulator.SimDeviceType.${IOS_DEVICE// /-}"

      xcrun simctl shutdown all || true

      SIM_UDID="$(xcrun simctl list -j devices available | jq -r --arg n "$IOS_DEVICE" --arg r "$RUNTIME_ID" '
        [ .devices | to_entries[]
          | select(.key == $r)
          | .value[]
          | select(.name == $n) ]
        | first | .udid // empty')"

      if [ -z "$SIM_UDID" ]; then
        echo "No existing '$IOS_DEVICE' on iOS $IOS_VERSION, trying to create it..."
        SIM_UDID="$(xcrun simctl create "$IOS_DEVICE" "$DEVICETYPE_ID" "$RUNTIME_ID" || true)"
      fi

      if [ -z "$SIM_UDID" ]; then
        echo "##vso[task.logissue type=error]Could not find or create '$IOS_DEVICE' with iOS $IOS_VERSION on this image"
        echo "--- Available runtimes ---"
        xcrun simctl list runtimes
        echo "--- Available devices ---"
        xcrun simctl list devices available
        exit 1
      fi

      echo "Using simulator: $SIM_UDID ($IOS_DEVICE, iOS $IOS_VERSION)"
      # Use the on-screen keyboard like the flows expect (best effort: this is a Simulator.app preference)
      defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
      xcrun simctl boot "$SIM_UDID" || true
      echo "##vso[task.setvariable variable=SIM_UDID]$SIM_UDID"
    displayName: Start simulator boot
    timeoutInMinutes: 10
    env:
      IOS_DEVICE: ${{ parameters.iosDevice }}
      IOS_VERSION: ${{ parameters.iosVersion }}

  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # ---- Cache the Maestro install (saved only when the whole job succeeds)
  - task: Cache@2
    displayName: Cache Maestro
    inputs:
      key: 'maestro | "$(Agent.OS)" | "$(MAESTRO_VERSION)"'
      path: /Users/runner/.maestro
      cacheHitVar: MAESTRO_CACHE_HIT

  - script: |
      set -euo pipefail
      export PATH="$HOME/.maestro/bin:$PATH"
      INSTALLED=""
      if command -v maestro >/dev/null 2>&1; then
        INSTALLED="$(maestro --version 2>&1 | tail -n 1 | tr -d '[:space:]')"
      fi

      if [ "$INSTALLED" = "$MAESTRO_VERSION" ]; then
        echo "Maestro $INSTALLED restored from cache, skipping install"
      else
        echo "Installing Maestro $MAESTRO_VERSION (found: '${INSTALLED:-none}')"
        curl -fsSL "https://get.maestro.mobile.dev" | bash
        INSTALLED="$(maestro --version 2>&1 | tail -n 1 | tr -d '[:space:]')"
      fi

      echo "Maestro version: $INSTALLED"
      if [ "$INSTALLED" != "$MAESTRO_VERSION" ]; then
        echo "##vso[task.logissue type=error]Expected Maestro $MAESTRO_VERSION but got $INSTALLED"
        exit 1
      fi

      # Remove old results that may have been restored from the cache
      rm -rf "$HOME/.maestro/tests"
      echo "##vso[task.prependpath]$HOME/.maestro/bin"
    displayName: Install Maestro
    env:
      MAESTRO_VERSION: $(MAESTRO_VERSION)

  # ---- Download and extract the simulator .app
  - script: |
      set -euo pipefail
      rm -rf "$(APP_WORK_DIR)" && mkdir -p "$(APP_WORK_DIR)"

      curl -fL --retry 3 --retry-delay 5 -o "$(APP_WORK_DIR)/app.zip" "$APP_ZIP_URL"
      ls -lh "$(APP_WORK_DIR)/app.zip"

      # A real zip starts with "PK". Anything else is usually an error page (private blob / expired SAS).
      if ! head -c 2 "$(APP_WORK_DIR)/app.zip" | grep -q PK; then
        echo "##vso[task.logissue type=error]Downloaded file is not a zip (check URL / blob access / SAS expiry)"
        head -c 300 "$(APP_WORK_DIR)/app.zip"
        exit 1
      fi

      # ditto keeps symlinks and permissions inside the .app
      ditto -x -k "$(APP_WORK_DIR)/app.zip" "$(APP_WORK_DIR)/unzipped"

      APP_PATH="$(find "$(APP_WORK_DIR)/unzipped" -maxdepth 4 -name "*.app" -type d -not -path "*/__MACOSX/*" | head -n 1)"
      if [ -z "$APP_PATH" ]; then
        echo "##vso[task.logissue type=error]No .app folder found in the zip"
        find "$(APP_WORK_DIR)/unzipped" -maxdepth 4
        exit 1
      fi

      echo "App: $APP_PATH"
      echo "Bundle ID: $(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"
      echo "Executable archs: $(lipo -archs "$APP_PATH/$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")" 2>/dev/null || echo unknown)"
      echo "##vso[task.setvariable variable=APP_PATH]$APP_PATH"

      # Folders the publish steps expect, so they never fail on a missing path
      mkdir -p "$(Build.SourcesDirectory)/.maestro/suite/reports/ios"
      mkdir -p "$(Build.SourcesDirectory)/.maestro/suite/screenshots"
    displayName: Download and extract app
    env:
      APP_ZIP_URL: ${{ parameters.appZipUrl }}

  # ---- By now the simulator has been booting for a few minutes: wait for it, then install
  - script: |
      set -euo pipefail
      xcrun simctl bootstatus "$SIM_UDID" -b

      # Best effort: stop autocorrect / prediction bar / accent pop-ups from changing typed text or covering buttons
      xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences KeyboardAutocorrection -bool false || true
      xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences KeyboardPrediction -bool false || true
      xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences KeyboardShowPredictionBar -bool false || true
      xcrun simctl spawn "$SIM_UDID" defaults write -g ApplePressAndHoldEnabled -bool false || true

      xcrun simctl install "$SIM_UDID" "$APP_PATH"
      echo "App installed on $SIM_UDID"

      # Health check for the APNs block above: how chatty is apsd now? Before the block it
      # logged ~1,200 lines a minute (a reconnect every ~0.2 s). A few dozen means it backed off.
      APSD_LINES="$(xcrun simctl spawn "$SIM_UDID" log show --last 1m --style compact --predicate 'process == "apsd"' 2>/dev/null | wc -l | tr -d ' ')"
      echo "apsd log lines in the last minute: ${APSD_LINES:-unknown}"
      if [ "${APSD_LINES:-0}" -gt 600 ] 2>/dev/null; then
        echo "##vso[task.logissue type=warning]apsd is still looping (${APSD_LINES} lines/min) - the simulator CPU will be saturated; check the packet filter step"
      fi
      echo "--- Top CPU consumers after boot ---"
      ps -Ao pcpu,pmem,comm -r | head -n 8 || true
    displayName: Wait for simulator and install app
    timeoutInMinutes: 15
    env:
      SIM_UDID: $(SIM_UDID)
      APP_PATH: $(APP_PATH)

  # ---- Warm up the Maestro iOS driver once, so the real run finds it installed and the
  # simulator's XCTest caches are hot. `maestro hierarchy` installs and starts the XCTest
  # runner and reads the screen WITHOUT launching an app (the old Safari launch added a slow
  # first-launch of Safari for nothing). The test run then reuses this runner
  # (--no-reinstall-driver) instead of uninstalling and reinstalling it.
  # (The QUIC/APNs network rules now run before the simulator boots - see above.)
  - script: |
      set -uo pipefail
      export PATH="$HOME/.maestro/bin:$PATH"
      for i in 1 2; do
        echo "Driver warm-up attempt $i"
        # 7 minute cap per attempt, so a hung driver start can't eat the job
        if perl -e 'alarm shift; exec @ARGV' 420 maestro --device "$SIM_UDID" hierarchy > /dev/null; then
          echo "Driver is ready"
          exit 0
        fi
        xcrun simctl terminate "$SIM_UDID" dev.mobile.maestro-driver-iosUITests.xctrunner || true
        sleep 10
      done
      echo "##vso[task.logissue type=error]Maestro iOS driver did not start after 2 attempts"
      exit 1
    displayName: Warm up Maestro iOS driver
    timeoutInMinutes: 16
    env:
      SIM_UDID: $(SIM_UDID)

  # ---- Diagnostics (set captureHomeUi=false once the Home search bar problem is solved).
  # Starts the app the same way the tests do, then saves a screenshot and the UI element tree,
  # so the real accessibility ids / labels on iOS can be compared with the ones the flows use.
  - ${{ if eq(parameters.captureHomeUi, true) }}:
    - script: |
        set -uo pipefail
        export PATH="$HOME/.maestro/bin:$PATH"
        DIAG="$(Build.ArtifactStagingDirectory)/home-ui"
        mkdir -p "$DIAG" "$(Agent.TempDirectory)/diag"
        cat > "$(Agent.TempDirectory)/diag/home.yaml" <<'EOF'
        appId: com.mrh.mobilestore
        ---
        - launchApp:
            clearState: true
            clearKeychain: true
            permissions:
              notifications: allow
        - extendedWaitUntil:
            visible:
              id: home-screen
            timeout: 180000
        - extendedWaitUntil:
            visible:
              id: 'home-top-banner-\d+-search(-bar-input)?'
            timeout: 60000
            optional: true
        - waitForAnimationToEnd:
            timeout: 5000
        EOF
        maestro --device "$SIM_UDID" test "$(Agent.TempDirectory)/diag/home.yaml" || echo "Home flow failed - capturing what is on screen anyway"
        xcrun simctl io "$SIM_UDID" screenshot "$DIAG/home.png" || true
        maestro --device "$SIM_UDID" hierarchy > "$DIAG/home-hierarchy.json" 2> "$DIAG/home-hierarchy.err" || true
        ls -lh "$DIAG"
        echo "Search bar entries in the UI tree:"
        grep -o '[^"]*search[^"]*' "$DIAG/home-hierarchy.json" | sort -u | head -20 || true
      displayName: Capture Home UI (diagnostic)
      timeoutInMinutes: 12
      continueOnError: true
      env:
        SIM_UDID: $(SIM_UDID)

    - task: PublishPipelineArtifact@1
      displayName: Upload Home UI diagnostics
      condition: always()
      continueOnError: true
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/home-ui'
        artifact: maestro-ios-home-ui-$(System.JobAttempt)

  # ---- Run the tests. run.ps1 expands the glob itself and runs every matched file in ONE
  # Maestro session (one driver startup, one report), so the glob is passed straight through.
  - pwsh: |
      $elapsedMin = [math]::Round(([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START_EPOCH) / 60, 1)
      Write-Host "Job time used before the tests: $elapsedMin min. The job limit is 60 min and the test step limit is 40 min."

      $targetPath = $env:TEST_PATH
      if ([string]::IsNullOrWhiteSpace($targetPath) -or $targetPath -eq 'tests') {
        $targetPath = 'tests/**/*.yaml'
      }
      Write-Host "Test path: $targetPath"

      Write-Host "Top CPU consumers before the tests:"
      ps -Ao pcpu,pmem,comm -r | Select-Object -First 8 | ForEach-Object { Write-Host "  $_" }

      # -NoReinstallDriver: reuse the XCTest runner the warm-up step installed instead of
      # uninstalling + reinstalling it at the start of every attempt.
      ./.maestro/suite/run.ps1 `
        -Platform ios `
        -Device $env:SIM_UDID `
        -Retries ([int]$env:RETRIES) `
        -NoReinstallDriver `
        -Path $targetPath
      exit $LASTEXITCODE
    displayName: Run Maestro tests
    timeoutInMinutes: 40
    env:
      JOB_START_EPOCH: $(JOB_START_EPOCH)
      TEST_PATH: ${{ parameters.testPath }}
      SIM_UDID: $(SIM_UDID)
      RETRIES: ${{ parameters.retries }}

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      searchFolder: '$(Build.SourcesDirectory)/.maestro/suite/reports/ios'
      # Only the final per-run report (<stamp>/report.xml). '**/report.xml' also picked up
      # every attempt-N/report.xml, so each test was published two or more times.
      testResultsFiles: '*/report.xml'
      testRunTitle: 'Maestro iOS'

  # ---- Collect everything useful when the run fails
  - script: |
      set -uo pipefail
      OUT="$FAILURE_DIR"
      mkdir -p "$OUT/reports" "$OUT/screenshots" "$OUT/maestro-logs" "$OUT/maestro-driver-logs" "$OUT/crash-logs" "$OUT/simulator"

      # Every screenshot from every attempt in one flat folder, named after its report path
      REPORTS="$(Build.SourcesDirectory)/.maestro/suite/reports/ios"
      find "$REPORTS" -name "*.png" -print0 2>/dev/null | while IFS= read -r -d '' f; do
        cp "$f" "$OUT/screenshots/$(echo "${f#$REPORTS/}" | tr '/ ' '__')" 2>/dev/null || true
      done

      # Maestro reports (JUnit xml, attempt-N/artifacts with screenshots, maestro.log, commands json)
      cp -R "$(Build.SourcesDirectory)/.maestro/suite/reports/ios/." "$OUT/reports/" 2>/dev/null || true
      cp -R "$(Build.SourcesDirectory)/.maestro/suite/screenshots/." "$OUT/screenshots/" 2>/dev/null || true

      # Maestro's own run folders and the iOS driver (XCTest runner) logs
      cp -R "$HOME/.maestro/tests/." "$OUT/maestro-logs/" 2>/dev/null || true
      cp -R "$HOME/Library/Logs/maestro/." "$OUT/maestro-driver-logs/" 2>/dev/null || true

      # Crash reports written by macOS for the app or simulator processes (last 2 hours)
      find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name "*.ips" -o -name "*.crash" \) -mmin -120 \
        -exec cp {} "$OUT/crash-logs/" \; 2>/dev/null || true

      xcrun simctl list > "$OUT/simulator/simctl-list.txt" 2>&1 || true

      if [[ "$SIM_UDID" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
        # What the simulator looks like right now
        xcrun simctl io "$SIM_UDID" screenshot "$OUT/simulator/final-screen.png" 2>&1 || true
        # UI element tree of the screen the run stopped on (2 minute limit)
        export PATH="$HOME/.maestro/bin:$PATH"
        perl -e 'alarm shift; exec @ARGV' 120 maestro --device "$SIM_UDID" hierarchy > "$OUT/simulator/final-hierarchy.json" 2> "$OUT/simulator/final-hierarchy.err" || true
        # Simulator system log (short window keeps this step fast)
        xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact > "$OUT/simulator/system.log" 2>&1 || true
        # CoreSimulator logs for this device
        cp -R "$HOME/Library/Logs/CoreSimulator/$SIM_UDID/." "$OUT/simulator/coresimulator/" 2>/dev/null || true
      else
        echo "No simulator UDID available (failure happened before the simulator was selected)"
      fi

      # Device logs are huge plain text (the last run had a 226 MB simulator log per test).
      # gzip compresses them ~10x, so the upload and your download are much faster.
      find "$OUT" -type f -name '*.log' -size +5M -exec gzip -1 {} + 2>/dev/null || true

      echo "Top CPU consumers at the end of the run:"
      ps -Ao pcpu,pmem,comm -r | head -n 10 | tee "$OUT/simulator/top-cpu.txt" || true

      echo "Collected files:"
      find "$OUT" -type f | head -n 100
      du -sh "$OUT" || true
      exit 0
    displayName: Collect failure artifacts
    condition: not(succeeded())     # failed or cancelled (e.g. job timeout)
    timeoutInMinutes: 6
    env:
      SIM_UDID: $(SIM_UDID)
      FAILURE_DIR: $(FAILURE_DIR)

  - task: PublishPipelineArtifact@1
    displayName: Upload failure artifacts
    condition: not(succeeded())
    continueOnError: true
    inputs:
      targetPath: '$(FAILURE_DIR)'
      artifact: maestro-ios-failure-artifacts-$(System.JobAttempt)