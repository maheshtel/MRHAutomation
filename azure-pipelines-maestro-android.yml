# Maestro Android tests (API 36) - Azure DevOps, Microsoft-hosted agent, manual trigger only.
trigger: none
pr: none

parameters:
  - name: apkUrl
    displayName: 'APK download URL'
    type: string
    default: 'https://autoteststoragemahesh.blob.core.windows.net/maheshcontainer/mrh.apk'
  - name: testPath
    displayName: 'Test file, folder or glob (relative to .maestro/suite, empty = whole suite)'
    type: string
    default: 'tests/**/*.yaml'
  - name: retries
    displayName: 'Retries per failed test'
    type: number
    default: 1
  - name: apiLevel
    displayName: 'Android API level'
    type: string
    default: '36'
  - name: failFast
    displayName: 'Stop at the first failing test file (faster feedback)'
    type: boolean
    default: false

variables:
  MAESTRO_VERSION: '2.11.0'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
  APK_FILE: '$(Agent.TempDirectory)/app.apk'
  ANDROID_SDK_DIR: '/Users/runner/Library/Android/sdk'
  MAESTRO_DIR: '/Users/runner/.maestro'

jobs:
- job: maestro_android
  displayName: Maestro - Android ${{ parameters.apiLevel }}
  timeoutInMinutes: 45
  pool:
    vmImage: macOS-15          # Intel x64 image; the x86_64 emulator needs it
  steps:
  - checkout: self
    fetchDepth: 1              # shallow clone = faster checkout
    clean: false

  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # ---- Caches: skip re-downloading the system image and Maestro on repeat runs ----
  - task: Cache@2
    displayName: Cache emulator system image
    continueOnError: true
    inputs:
      key: 'android-image | "$(Agent.OS)" | "api${{ parameters.apiLevel }}"'
      path: '$(ANDROID_SDK_DIR)/system-images/android-${{ parameters.apiLevel }}'

  - task: Cache@2
    displayName: Cache Maestro
    continueOnError: true
    inputs:
      key: 'maestro | "$(Agent.OS)" | "$(MAESTRO_VERSION)"'
      path: '$(MAESTRO_DIR)'

  # ---- Start the emulator FIRST so it boots while Maestro/APK steps run ----
  - script: |
      set -e
      SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
      EMU="$ANDROID_HOME/emulator/emulator"
      API="${{ parameters.apiLevel }}"

      yes | "$SDK/sdkmanager" --licenses > /dev/null || true
      "$SDK/sdkmanager" --install "emulator" "platform-tools" > /dev/null

      # Prefer the light 'default' image; fall back to google_apis if it doesn't exist for this API level
      IMAGE="system-images;android-${API};default;x86_64"
      if ! "$SDK/sdkmanager" --install "$IMAGE" > /dev/null 2>&1; then
        echo "'default' image not available for API $API, using google_apis"
        IMAGE="system-images;android-${API};google_apis;x86_64"
        "$SDK/sdkmanager" --install "$IMAGE" > /dev/null
      fi
      echo "Using image: $IMAGE"

      echo "no" | "$SDK/avdmanager" create avd -n ci -k "$IMAGE" -d pixel_6 --force
      "$EMU" -accel-check || true

      LOG="$(Agent.TempDirectory)/emulator.log"
      nohup "$EMU" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
        -accel on -cores 3 -memory 4096 -gpu swiftshader_indirect \
        -camera-back none -camera-front none -netdelay none -netspeed full \
        > "$LOG" 2>&1 &
      echo "Emulator launching in background"
    displayName: Launch Android emulator (background boot)

  - script: |
      set -e
      if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
        export MAESTRO_VERSION="$(MAESTRO_VERSION)"
        curl -fsSL "https://get.maestro.mobile.dev" | bash
      else
        echo "Maestro restored from cache"
      fi
      echo "##vso[task.prependpath]$HOME/.maestro/bin"
      echo "##vso[task.prependpath]$ANDROID_HOME/platform-tools"
      echo "##vso[task.prependpath]$ANDROID_HOME/emulator"
      "$HOME/.maestro/bin/maestro" --version
    displayName: Install Maestro

  - script: |
      set -e
      curl -fL --retry 3 -o "$(APK_FILE)" "$APK_URL"
      ls -lh "$(APK_FILE)"
      # A real APK is a zip file and starts with "PK"
      head -c 2 "$(APK_FILE)" | grep -q PK || { echo "##vso[task.logissue type=error]Downloaded file is not an APK (check the URL / blob access)"; head -c 300 "$(APK_FILE)"; exit 1; }
    displayName: Download APK
    env:
      APK_URL: ${{ parameters.apkUrl }}

  # ---- Wait for the emulator (it has been booting during the steps above) ----
  - script: |
      set -e
      ADB="$ANDROID_HOME/platform-tools/adb"
      LOG="$(Agent.TempDirectory)/emulator.log"

      START=$(date +%s)
      until [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
        ELAPSED=$(( $(date +%s) - START ))
        if [ $ELAPSED -gt 600 ]; then
          echo "##vso[task.logissue type=error]Emulator did not boot in 10 minutes"
          tail -n 100 "$LOG"; exit 1
        fi
        if [ $(( ELAPSED % 60 )) -lt 2 ]; then echo "  ${ELAPSED}s - $(tail -n 1 "$LOG")"; fi
        sleep 2
      done
      echo "Boot completed after waiting ${ELAPSED:-0}s"

      # Wait until the package manager answers (real readiness), instead of a fixed long sleep
      until "$ADB" shell pm path android 2>/dev/null | grep -q package; do sleep 1; done

      # Silence dialogs, disable animations (faster, less flaky)
      "$ADB" shell settings put global hide_error_dialogs 1
      "$ADB" shell settings put secure anr_show_background 0
      "$ADB" shell settings put global package_verifier_enable 0
      "$ADB" shell settings put global window_animation_scale 0
      "$ADB" shell settings put global transition_animation_scale 0
      "$ADB" shell settings put global animator_duration_scale 0
      "$ADB" shell input keyevent KEYCODE_HOME

      sleep 10    # short settle for post-boot background work
      "$ADB" devices
    displayName: Wait for emulator ready

  # run.ps1 installs the APK (-Apk/-ReinstallApp) and runs the tests.
  # A glob such as tests/**/*.yaml is expanded here, so no yaml file is missed.
  - pwsh: |
      $suite = (Resolve-Path (Join-Path $env:BUILD_SOURCESDIRECTORY '.maestro/suite')).Path

      $common = @{
        Platform     = 'android'
        Device       = 'emulator-5554'
        Apk          = $env:APK_FILE
        ReinstallApp = $true
        Retries      = [int]$env:RETRIES
      }

      $testPath = $env:TEST_PATH
      $failFast = ($env:FAIL_FAST -eq 'true')

      # 1) Empty = whole suite (single run.ps1 call = fastest, one driver startup)
      if ([string]::IsNullOrWhiteSpace($testPath)) {
        ./.maestro/suite/run.ps1 @common
        exit $LASTEXITCODE
      }

      # 2) Glob = expand it ourselves (supports ** for subfolders)
      if ($testPath -match '[\*\?]') {
        $glob = $testPath -replace '\\', '/'
        $rx = '^' + ([regex]::Escape($glob) `
                -replace '\\\*\\\*/', '(.*/)?' `
                -replace '\\\*\\\*',  '.*' `
                -replace '\\\*',      '[^/]*' `
                -replace '\\\?',      '[^/]') + '$'

        $files = Get-ChildItem -Path $suite -Recurse -File |
          ForEach-Object {
            $rel = $_.FullName.Substring($suite.Length).TrimStart('/', '\') -replace '\\', '/'
            if ($rel -match $rx) { $rel }
          } | Sort-Object

        if (-not $files) {
          Write-Host "##vso[task.logissue type=error]No files matched '$testPath'"
          exit 1
        }

        Write-Host "Matched $(@($files).Count) file(s):"
        $files | ForEach-Object { Write-Host "  $_" }

        $failed = 0
        foreach ($f in $files) {
          Write-Host "=== Running $f ==="
          ./.maestro/suite/run.ps1 @common -Path $f
          if ($LASTEXITCODE -ne 0) {
            $failed++
            if ($failFast) { Write-Host "Fail-fast enabled, stopping."; break }
          }
          # Reinstall the app only before the first test
          $common.ReinstallApp = $false
        }

        if ($failed -gt 0) {
          Write-Host "##vso[task.logissue type=error]$failed test file(s) failed"
          exit 1
        }
        exit 0
      }

      # 3) Plain file or folder
      ./.maestro/suite/run.ps1 @common -Path $testPath
      exit $LASTEXITCODE
    displayName: Run Maestro tests
    env:
      APK_FILE: $(APK_FILE)
      RETRIES: ${{ parameters.retries }}
      TEST_PATH: ${{ parameters.testPath }}
      FAIL_FAST: ${{ parameters.failFast }}

  # ---- Reporting (always runs) ----
  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      searchFolder: '$(Build.SourcesDirectory)/.maestro/suite/reports/android'
      testResultsFiles: '**/report.xml'
      testRunTitle: 'Maestro Android API ${{ parameters.apiLevel }}'

  # Only collect artifacts that exist, and only when something failed, to save upload time
  - script: |
      STAGE="$(Build.ArtifactStagingDirectory)/maestro-artifacts"
      mkdir -p "$STAGE"
      SHOTS="$(Build.SourcesDirectory)/.maestro/suite/screenshots"
      [ -d "$SHOTS" ] && cp -R "$SHOTS" "$STAGE/screenshots" || true
      [ -d "$HOME/.maestro/tests" ] && cp -R "$HOME/.maestro/tests" "$STAGE/maestro-logs" || true
      cp "$(Agent.TempDirectory)/emulator.log" "$STAGE/" 2>/dev/null || true
    displayName: Collect failure artifacts
    condition: failed()

  - task: PublishPipelineArtifact@1
    displayName: Upload failure artifacts
    condition: failed()
    continueOnError: true
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/maestro-artifacts'
      artifact: maestro-android-failure-$(System.JobAttempt)

  - script: '"$ANDROID_HOME/platform-tools/adb" emu kill || true'
    displayName: Stop emulator
    condition: always()
