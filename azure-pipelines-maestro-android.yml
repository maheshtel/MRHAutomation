# Maestro Android tests (default API 34) - Azure DevOps, Microsoft-hosted agent, manual trigger only.
trigger: none
pr: none

parameters:
  - name: apkUrl
    displayName: 'APK download URL'
    type: string
    default: 'https://autoteststoragemahesh.blob.core.windows.net/maheshcontainer/mrh.apk'
  - name: testPath
    displayName: 'Test file, folder or glob (relative to .maestro/suite, empty = whole suite)'
    type: string
    default: 'tests/**/*.yaml'
  - name: retries
    displayName: 'Retries per failed test'
    type: number
    default: 0
  - name: apiLevel
    displayName: 'Android API level'
    type: string
    default: '34'
  - name: imageVariant
    displayName: 'System image: default (light, no Google services) or google_apis'
    type: string
    default: 'default'
    values:
      - default
      - google_apis
  - name: screenSize
    displayName: 'Emulator screen size (smaller = much faster rendering on the 1-vCPU hosted emulator; empty = device default)'
    type: string
    default: '720x1280'
  - name: shardCount
    displayName: 'Parallel jobs (test files are split across them; each job boots its own emulator)'
    type: number
    default: 1
  # false (default) = all test files run in ONE Maestro session: one driver install/start
  # for the whole run. true = one Maestro session PER FILE so the run can stop at the first
  # failure; every file then pays a new Maestro JVM start + driver start (slower overall).
  - name: failFast
    displayName: 'Stop at the first failing test file (runs files one by one - slower when tests pass)'
    type: boolean
    default: false

variables:
  MAESTRO_VERSION: '2.11.0'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
  # "Agent environment resources ... Unable to get CPU info, exception: The operation was
  # canceled" is the agent's DEBUG resource monitor: its CPU probe times out because the
  # emulator saturates the hosted Mac's CPUs. It is a symptom, not an error, and only prints
  # with system diagnostics on. Keep debug off for normal runs (set 'true' only when you need
  # agent diagnostics), so the monitor stops spawning probes on a busy Mac.
  # (The agent's AZP_ENABLE_RESOURCE_* knobs are reserved system variables and cannot be set
  # here - Azure rejects the pipeline with "Cannot override system variable".)
  system.debug: 'false'
  APK_FILE: '$(Agent.TempDirectory)/app.apk'
  ANDROID_SDK_DIR: '/Users/runner/Library/Android/sdk'
  MAESTRO_DIR: '/Users/runner/.maestro'

jobs:
- job: maestro_android
  displayName: Maestro - Android ${{ parameters.apiLevel }}
  timeoutInMinutes: 60
  strategy:
    parallel: ${{ parameters.shardCount }}
  pool:
    vmImage: macOS-15          # Intel x64 image; the x86_64 emulator needs it
  steps:
  - checkout: self
    fetchDepth: 1              # shallow clone = faster checkout
    clean: false

  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # ---- Caches: skip re-downloading the system image and Maestro on repeat runs ----
  - task: Cache@2
    displayName: Cache emulator system image
    continueOnError: true
    inputs:
      key: 'android-image | "$(Agent.OS)" | "${{ parameters.imageVariant }}" | "api${{ parameters.apiLevel }}"'
      path: '$(ANDROID_SDK_DIR)/system-images/android-${{ parameters.apiLevel }}'

  - task: Cache@2
    displayName: Cache Maestro
    continueOnError: true
    inputs:
      key: 'maestro | "$(Agent.OS)" | "$(MAESTRO_VERSION)"'
      path: '$(MAESTRO_DIR)'

  # ---- Start the emulator FIRST so it boots while Maestro/APK steps run ----
  - script: |
      set -e
      SDK="$ANDROID_HOME/cmdline-tools/latest/bin"
      EMU="$ANDROID_HOME/emulator/emulator"
      API="${{ parameters.apiLevel }}"

      # Spotlight indexing (mds_stores) on a fresh hosted Mac competes with the emulator
      # for the few vCPUs; the job never needs it.
      sudo mdutil -a -i off >/dev/null 2>&1 && echo "Spotlight indexing disabled" || true

      # Ensure adb server starts cleanly to prevent port 5037 binding drops
      export PATH="$ANDROID_HOME/platform-tools:$PATH"
      adb kill-server || true
      adb start-server

      yes | "$SDK/sdkmanager" --licenses > /dev/null || true
      # The hosted image already ships the emulator and platform-tools. Re-installing them
      # every run downloads ~300 MB BEFORE the emulator can start booting (the boot is the
      # critical path), so only install what is missing.
      [ -x "$EMU" ] || "$SDK/sdkmanager" --install "emulator" > /dev/null
      [ -x "$ANDROID_HOME/platform-tools/adb" ] || "$SDK/sdkmanager" --install "platform-tools" > /dev/null
      echo "Emulator: $("$EMU" -version 2>/dev/null | head -n 1)"

      # 'default' = light AOSP image (fastest). Use google_apis only if the app needs Google Play services.
      IMAGE="system-images;android-${API};${{ parameters.imageVariant }};x86_64"
      "$SDK/sdkmanager" --install "$IMAGE" > /dev/null
      echo "Using image: $IMAGE"

      echo "no" | "$SDK/avdmanager" create avd -n ci -k "$IMAGE" -d pixel_6 --force

      # The hosted Mac has <6 logical cores, so emulator 37 forces 1 vCPU (-cores is ignored).
      # With 1 vCPU and software rendering, a smaller screen is the biggest speed-up.
      echo "Host logical CPUs: $(sysctl -n hw.logicalcpu)"
      SKIN_ARGS=""
      SCREEN="${{ parameters.screenSize }}"
      if [ -n "$SCREEN" ]; then
        W="${SCREEN%x*}"; H="${SCREEN#*x}"
        AVD_CFG="$HOME/.android/avd/ci.avd/config.ini"
        sed -i '' -E '/^(hw\.lcd\.(width|height|density)|skin\.(name|path))/d' "$AVD_CFG"
        printf 'hw.lcd.width=%s\nhw.lcd.height=%s\nhw.lcd.density=320\n' "$W" "$H" >> "$AVD_CFG"
        SKIN_ARGS="-skin ${W}x${H}"
        echo "Screen: ${W}x${H} @320dpi"
      fi
      "$EMU" -accel-check || true

      LOG="$(Agent.TempDirectory)/emulator.log"
      nohup "$EMU" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
        -accel on -memory 4096 -gpu swiftshader_indirect $SKIN_ARGS \
        -camera-back none -camera-front none -netdelay none -netspeed full \
        > "$LOG" 2>&1 &
      echo "Emulator launching in background"
    displayName: Launch Android emulator (background boot)

  - script: |
      set -e
      if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
        export MAESTRO_VERSION="$(MAESTRO_VERSION)"
        curl -fsSL "https://get.maestro.mobile.dev" | bash
      else
        echo "Maestro restored from cache"
      fi
      echo "##vso[task.prependpath]$HOME/.maestro/bin"
      echo "##vso[task.prependpath]$ANDROID_HOME/platform-tools"
      echo "##vso[task.prependpath]$ANDROID_HOME/emulator"
      "$HOME/.maestro/bin/maestro" --version
    displayName: Install Maestro

  - script: |
      set -e
      curl -fL --retry 3 -o "$(APK_FILE)" "$APK_URL"
      ls -lh "$(APK_FILE)"
      # A real APK is a zip file and starts with "PK"
      head -c 2 "$(APK_FILE)" | grep -q PK || { echo "##vso[task.logissue type=error]Downloaded file is not an APK (check the URL / blob access)"; head -c 300 "$(APK_FILE)"; exit 1; }
    displayName: Download APK
    env:
      APK_URL: ${{ parameters.apkUrl }}

  # ---- Wait for the emulator (it has been booting during the steps above) ----
  - script: |
      set -e
      ADB="$ANDROID_HOME/platform-tools/adb"
      LOG="$(Agent.TempDirectory)/emulator.log"

      MAX=900   # 15 minutes
      START=$(date +%s)
      LAST_PRINT=-30
      while true; do
        ELAPSED=$(( $(date +%s) - START ))
        BOOT="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
        [ "$BOOT" = "1" ] && break

        # Fail fast if the emulator process died instead of waiting out the timeout
        if ! pgrep -f "qemu-system" > /dev/null; then
          echo "##vso[task.logissue type=error]Emulator process is not running (crashed?)"
          tail -n 100 "$LOG"; exit 1
        fi

        if [ $ELAPSED -gt $MAX ]; then
          echo "##vso[task.logissue type=error]Emulator did not boot in $((MAX/60)) minutes"
          tail -n 100 "$LOG"; exit 1
        fi

        # Progress line every 30s (ignores the harmless update-check warning)
        if [ $(( ELAPSED - LAST_PRINT )) -ge 30 ]; then
          STATE="$("$ADB" get-state 2>/dev/null || echo offline)"
          LASTLINE="$(grep -v 'emu-update-last-check' "$LOG" | tail -n 1 | cut -c1-120)"
          echo "  ${ELAPSED}s | process: running | adb: ${STATE} | boot_completed: ${BOOT:-n/a} | log: ${LASTLINE:-<none>}"
          LAST_PRINT=$ELAPSED
        fi
        sleep 2
      done
      echo "Boot completed after ${ELAPSED}s"

      # Wait until the package manager answers (real readiness), instead of a fixed long sleep
      until "$ADB" shell pm path android 2>/dev/null | grep -q package; do sleep 1; done

      # Silence dialogs, disable animations (faster, less flaky)
      "$ADB" shell settings put global hide_error_dialogs 1
      "$ADB" shell settings put secure anr_show_background 0
      "$ADB" shell settings put global package_verifier_enable 0
      "$ADB" shell settings put global window_animation_scale 0
      "$ADB" shell settings put global transition_animation_scale 0
      "$ADB" shell settings put global animator_duration_scale 0
      "$ADB" shell input keyevent KEYCODE_HOME

      sleep 10    # short settle for post-boot background work
      "$ADB" devices
    displayName: Wait for emulator ready

  # ---- Launch check + warm-up: install, start the app once, capture evidence, stop early if it can't start ----
  - script: |
      ADB="$ANDROID_HOME/platform-tools/adb"
      PKG=com.mrh.mobilestore
      OUT="$(Build.ArtifactStagingDirectory)/maestro-artifacts"
      LOG="$(Agent.TempDirectory)/emulator.log"
      mkdir -p "$OUT"

      echo "vCPU line from emulator log:"; grep -i "virtual cores" "$LOG" || echo "  (none)"

      "$ADB" install -r -g "$(APK_FILE)"
      "$ADB" logcat -c
      "$ADB" shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
      sleep 40    # warm-up: first launch compiles/loads the app, so later cold starts are faster

      "$ADB" exec-out screencap -p > "$OUT/launch.png"
      "$ADB" logcat -d > "$OUT/launch-logcat.txt"
      cp "$LOG" "$OUT/emulator.log" 2>/dev/null || true

      grep -E "FATAL EXCEPTION|ANR in|Process: $PKG" "$OUT/launch-logcat.txt" | head -20 || true
      if [ -z "$("$ADB" shell pidof $PKG | tr -d '\r')" ]; then
        echo "##vso[task.logissue type=error]App is not running after launch - see launch.png / launch-logcat.txt"
        exit 1
      fi
      echo "App process is running"
    displayName: App launch check (warm-up)

  # The warm-up step above already installed the APK on this fresh emulator, so run.ps1
  # does NOT reinstall it (-ReinstallApp used to install it a second time, which also threw
  # away the warm-up's compiled code). -Apk stays as a fallback if the app is missing.
  # A glob such as tests/**/*.yaml is expanded here, so no yaml file is missed.
  - pwsh: |
      $suite = (Resolve-Path (Join-Path $env:BUILD_SOURCESDIRECTORY '.maestro/suite')).Path

      $common = @{
        Platform = 'android'
        Device   = 'emulator-5554'
        Apk      = $env:APK_FILE
        Retries  = [int]$env:RETRIES
      }

      $testPath = $env:TEST_PATH
      $failFast = ($env:FAIL_FAST -eq 'true')

      # 1) Empty = whole suite (single run.ps1 call = fastest, one driver startup)
      if ([string]::IsNullOrWhiteSpace($testPath)) {
        ./.maestro/suite/run.ps1 @common
        exit $LASTEXITCODE
      }

      # 2) Glob = expand it ourselves (supports ** for subfolders)
      if ($testPath -match '[\*\?]') {
        $glob = $testPath -replace '\\', '/'
        $rx = '^' + ([regex]::Escape($glob) `
            -replace '\\\*\\\*/', '(.*/)?' `
            -replace '\\\*\\\*',  '.*' `
            -replace '\\\*',      '[^/]*' `
            -replace '\\\?',      '[^/]') + '$'

        $files = Get-ChildItem -Path $suite -Recurse -File |
          ForEach-Object {
            $rel = $_.FullName.Substring($suite.Length).TrimStart('/', '\') -replace '\\', '/'
            if ($rel -match $rx) { $rel }
          } | Sort-Object

        if (-not $files) {
          Write-Host "##vso[task.logissue type=error]No files matched '$testPath'"
          exit 1
        }

        Write-Host "Matched $(@($files).Count) file(s) in total"

        # Split the files across parallel jobs (round-robin)
        $pos = 1; $total = 1
        [void][int]::TryParse($env:SHARD_POS, [ref]$pos)
        [void][int]::TryParse($env:SHARD_TOTAL, [ref]$total)
        if ($pos -lt 1) { $pos = 1 }
        if ($total -lt 1) { $total = 1 }
        $mine = @()
        for ($i = 0; $i -lt @($files).Count; $i++) {
          if (($i % $total) -eq ($pos - 1)) { $mine += $files[$i] }
        }
        $files = $mine
        Write-Host "Shard $pos of $total runs $(@($files).Count) file(s):"
        $files | ForEach-Object { Write-Host "  $_" }
        if (@($files).Count -eq 0) { Write-Host "Nothing to run in this shard."; exit 0 }

        # Default: every file of this shard in ONE Maestro session (one driver start).
        if (-not $failFast) {
          ./.maestro/suite/run.ps1 @common -Path @($files)
          exit $LASTEXITCODE
        }

        # failFast: one session per file. The driver is installed by the first file's run;
        # later files reuse it (-NoReinstallDriver) instead of reinstalling both driver APKs.
        $failed = 0
        $first = $true
        foreach ($f in $files) {
          Write-Host "=== Running $f ==="
          if ($first) { ./.maestro/suite/run.ps1 @common -Path $f }
          else { ./.maestro/suite/run.ps1 @common -Path $f -NoReinstallDriver }
          $first = $false
          if ($LASTEXITCODE -ne 0) {
            $failed++
            Write-Host "Fail-fast enabled, stopping."
            break
          }
        }

        if ($failed -gt 0) {
          Write-Host "##vso[task.logissue type=error]$failed test file(s) failed"
          exit 1
        }
        exit 0
      }

      # 3) Plain file or folder
      ./.maestro/suite/run.ps1 @common -Path $testPath
      exit $LASTEXITCODE
    displayName: Run Maestro tests
    timeoutInMinutes: 40
    env:
      APK_FILE: $(APK_FILE)
      RETRIES: ${{ parameters.retries }}
      TEST_PATH: ${{ parameters.testPath }}
      FAIL_FAST: ${{ parameters.failFast }}
      SHARD_POS: $(System.JobPositionInPhase)
      SHARD_TOTAL: $(System.TotalJobsInPhase)

  # ---- Reporting (always runs) ----
  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      searchFolder: '$(Build.SourcesDirectory)/.maestro/suite/reports/android'
      # Only the final per-run report (<stamp>/report.xml). '**/report.xml' also picked up
      # every attempt-N/report.xml, so each test was published two or more times.
      testResultsFiles: '*/report.xml'
      testRunTitle: 'Maestro Android API ${{ parameters.apiLevel }} - shard $(System.JobPositionInPhase)'

  # Only collect artifacts that exist, and only when something failed, to save upload time
  # (this used to run and upload on every successful run too).
  - script: |
      STAGE="$(Build.ArtifactStagingDirectory)/maestro-artifacts"
      mkdir -p "$STAGE"
      SHOTS="$(Build.SourcesDirectory)/.maestro/suite/screenshots"
      [ -d "$SHOTS" ] && cp -R "$SHOTS" "$STAGE/screenshots" || true
      # Per-attempt Maestro artifacts (failure screenshots, UI trees, maestro.log, logcat)
      REPORTS="$(Build.SourcesDirectory)/.maestro/suite/reports/android"
      [ -d "$REPORTS" ] && cp -R "$REPORTS" "$STAGE/reports" || true
      [ -d "$HOME/.maestro/tests" ] && cp -R "$HOME/.maestro/tests" "$STAGE/maestro-logs" || true
      cp "$(Agent.TempDirectory)/emulator.log" "$STAGE/" 2>/dev/null || true
      # Big text logs compress ~10x: faster upload and download
      find "$STAGE" -type f \( -name '*.log' -o -name '*.txt' \) -size +5M -exec gzip -1 {} + 2>/dev/null || true
      echo "Top CPU consumers at the end of the run:"
      ps -Ao pcpu,pmem,comm -r | head -n 10 | tee "$STAGE/top-cpu.txt" || true
      du -sh "$STAGE" || true
    displayName: Collect failure artifacts
    condition: not(succeeded())

  - task: PublishPipelineArtifact@1
    displayName: Upload failure artifacts
    condition: not(succeeded())
    continueOnError: true
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/maestro-artifacts'
      artifact: maestro-android-failure-$(System.JobAttempt)-shard$(System.JobPositionInPhase)

  - script: '"$ANDROID_HOME/platform-tools/adb" emu kill || true'
    displayName: Stop emulator
    condition: always()